# Local services for Multicast: Postgres, Redis and an S3-compatible bucket (MinIO).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: multicast
      POSTGRES_PASSWORD: multicast
      POSTGRES_DB: multicast
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: multicast
      MINIO_ROOT_PASSWORD: multicast-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  redisdata:
  miniodata:
